[project]
name = "principios-codigo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
    "radon==6.0.1",
]

[tool.pytest.ini_options]
testpaths = ["examples"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "SIM",
    "N",
    "C90",
    "RET",
    "PL",
]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.per-file-ignores]
# Anti-pattern before files require exempting cyclomatic complexity, nested branching, and redundant elses
"examples/*/before.py" = ["C901", "PLR0911", "PLR0912", "PLR0915", "PLR2004", "PLR5501", "RET505", "RET506", "SIM102", "SIM103", "SIM108"]
# Test files legitimately compare against literal magic numbers and assertions
"examples/**/test_*.py" = ["PLR2004"]
