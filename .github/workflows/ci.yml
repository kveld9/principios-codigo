name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Principle of least privilege: explicitly restrict token permissions to read-only
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-markdown:
    name: Markdown Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Lint Markdown Files
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            **/*.md
            !node_modules

  no-emoji-execution-surfaces:
    name: Verify No Emojis in Execution Surfaces
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check execution surfaces for prohibited emojis
        run: |
          echo "Scanning execution surfaces for prohibited emojis..."
          TARGETS=(
            .github/workflows/
            .editorconfig
            .gitattributes
            .gitignore
            .markdownlint.yaml
            examples/
          )
          if grep -rnP '[\x{1F000}-\x{1FAFF}\x{2600}-\x{27BF}]' "${TARGETS[@]}"; then
            echo "::error::Prohibited emojis detected in execution surfaces." >&2
            exit 1
          fi
          echo "All execution surfaces are clean of emojis."

  python-examples:
    name: Python Tooling and Examples Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Upgrade pip and install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --group dev

      - name: Run Ruff linter
        run: ruff check .

      - name: Check formatting with Ruff
        run: ruff format --check .

      - name: Run test suite with pytest
        run: pytest

      - name: Verify cyclomatic complexity gate
        run: |
          OUTPUT=$(radon cc --min B --show-complexity --exclude "examples/*/before.py,examples/*/before/*" examples)
          if [ -n "$OUTPUT" ]; then
            echo "::error::Functions with cyclomatic complexity exceeding threshold (CC > 5) detected:"
            echo "$OUTPUT"
            exit 1
          fi
